{{- if .Values.wellKnown.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tuwunel.fullname" . }}-wellknown
  labels:
    {{- include "tuwunel.labels" . | nindent 4 }}
    app.kubernetes.io/component: wellknown
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wellknown
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/wellknown-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "tuwunel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wellknown
    spec:
      initContainers:
        - name: setup
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              mkdir -p /wellknown/.well-known/matrix
              cp /config/server.json /wellknown/.well-known/matrix/server
              cp /config/client.json /wellknown/.well-known/matrix/client
          volumeMounts:
            - name: wellknown-config
              mountPath: /config
            - name: wellknown-data
              mountPath: /wellknown
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: wellknown-data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: wellknown-config
          configMap:
            name: {{ include "tuwunel.fullname" . }}-wellknown
        - name: wellknown-data
          emptyDir: {}
{{- end }}
