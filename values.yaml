image:
  repository: jevolk/tuwunel
  pullPolicy: IfNotPresent
  tag: "0.5.0"

serverName: ""
databasePath: "/data"
port: 8008

replicaCount: 1

service:
  type: ClusterIP
  port: 8008

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: tuwunel.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tuwunel-tls
      hosts:
        - tuwunel.local

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 10Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

config:
  newUserDisplaynameSuffix: "💕"
  maxRequestSize: 10485760
  allowRegistration: true
  allowFederation: false
  allowCheckForgottenKey: true
  logLevel: "info"
  trustedServers: []
  adminRoomTag: "admin"
  wellKnown:
    server: ""
    client:
      homeserverUrl: ""
      identityServerUrl: ""
  additionalConfig: {}

# Static registration token. If set, new users must provide this token when registering.
# For token-only registration, set allowRegistration: true and provide a token here
# or via registrationTokenSecret. Do NOT set yesIAmVerySure together with a token.
registrationToken: ""

# Alternatively, mount an existing Kubernetes Secret containing the registration token.
registrationTokenSecret:
  enabled: false
  # Name of an existing Secret in the same namespace.
  # The Secret must contain the key specified below.
  name: ""
  # Key inside the Secret that holds the token string.
  key: "token"
  # Path where the token file will be mounted inside the container.
  mountPath: "/etc/tuwunel/secrets/registration_token"

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

metrics:
  enabled: false
  port: 9000

wellKnown:
  enabled: false
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  tls: []

serviceAccount:
  create: true
  name: ""

# ------------------------------------------------------------------
# MatrixRTC (Voice/Video calling via LiveKit SFU)
# ------------------------------------------------------------------
matrixRtc:
  enabled: false

  # well-known announcement of RTC foci (MSC4143)
  wellKnown:
    enabled: true
    foci:
      - type: "livekit"
        livekit_service_url: ""

  # Shared ingress for all MatrixRTC components
  ingress:
    enabled: true
    className: "traefik"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    host: ""
    tls: []

  # ----------------------------------------------------------------
  # LiveKit SFU
  # ----------------------------------------------------------------
  livekit:
    deploy: false
    hostNetwork: false
    externalUrl: ""
    externalApiUrl: ""
    config:
      port: 7880
      rtc:
        udp_port: 7882
        tcp_port: 7881
        use_external_ip: true
        # port_range_start: 50000
        # port_range_end: 60000
      keys:
        devkey: "secret"
      webhook:
        api_key: "devkey"
        urls: []
      room:
        auto_create: false
      turn:
        enabled: true
        domain: ""
        tls_port: 3478
    loadBalancer:
      type: LoadBalancer
      annotations: {}
    nodePorts:
      enabled: false
      udpStart: 50000
      udpEnd: 60000

  # ----------------------------------------------------------------
  # MatrixRTC Authorization Service (lk-jwt-service)
  # ----------------------------------------------------------------
  authService:
    deploy: true
    image:
      repository: ghcr.io/element-hq/lk-jwt-service
      tag: "0.5.0"
      pullPolicy: IfNotPresent
    port: 8080
    env:
      LIVEKIT_URL: ""
      LIVEKIT_KEY: ""
      LIVEKIT_SECRET: ""
      LIVEKIT_FULL_ACCESS_HOMESERVERS: ""
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "0"
      LIVEKIT_LOG_LEVEL: "info"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      type: ClusterIP
      port: 8080
    nodeSelector: {}
    tolerations: []
    affinity: {}


# ------------------------------------------------------------------
# Appservice registrations (bridges, bots, etc.)
# ------------------------------------------------------------------
appservices: {}
