image:
  repository: jevolk/tuwunel
  pullPolicy: IfNotPresent
  tag: "latest"

serverName: ""
databasePath: "/data"
port: 8008

replicaCount: 1

service:
  type: ClusterIP
  port: 8008

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  hosts:
    - host: tuwunel.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: tuwunel-tls
      hosts:
        - tuwunel.local

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 10Gi

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

config:
  newUserDisplaynameSuffix: "💕"
  maxRequestSize: 10485760
  allowRegistration: true
  allowFederation: false
  allowCheckForgottenKey: true
  logLevel: "info"
  trustedServers: []
  adminRoomTag: "admin"
  wellKnown:
    server: ""
    client:
      homeserverUrl: ""
      identityServerUrl: ""
  additionalConfig: {}

# Static registration token. If set, new users must provide this token when registering.
# For token-only registration, set allowRegistration: true and provide a token here
# or via registrationTokenSecret. Do NOT set yesIAmVerySure together with a token.
registrationToken: ""

# Alternatively, mount an existing Kubernetes Secret containing the registration token.
registrationTokenSecret:
  enabled: false
  # Name of an existing Secret in the same namespace.
  # The Secret must contain the key specified below.
  name: ""
  # Key inside the Secret that holds the token string.
  key: "token"
  # Path where the token file will be mounted inside the container.
  mountPath: "/etc/tuwunel/secrets/registration_token"

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

metrics:
  enabled: false
  port: 9000

wellKnown:
  enabled: false
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
  tls: []

serviceAccount:
  create: true
  name: ""
